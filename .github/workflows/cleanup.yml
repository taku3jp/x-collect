name: cleanup-channel

# X収集タブの既存行から、指定した誘導先へ飛ぶ投稿を再検証して削除する。
# 手動実行専用。target に誘導先（例: myfans.jp/jukiya_erotame）を入れる。
on:
  workflow_dispatch:
    inputs:
      target:
        description: "除外する誘導先（URL部分一致・小文字）"
        required: true
        default: "myfans.jp/jukiya_erotame"
      dry_run:
        description: "削除せずマッチ行の表示だけ行う (true/false)"
        required: false
        default: "false"

jobs:
  cleanup:
    concurrency: cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Setup Cloudflare WARP (residential-like egress)
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ noble main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode warp
          warp-cli --accept-tos connect
          sleep 5
          warp-cli --accept-tos status || true
          curl -s --max-time 15 https://cloudflare.com/cdn-cgi/trace | head -5

      - name: Restore X session
        run: echo "$X_STATE_JSON" > state.json
        env:
          X_STATE_JSON: ${{ secrets.X_STATE_JSON }}

      - name: Cleanup rows linking to target channel
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_TOKEN: ${{ secrets.APPS_SCRIPT_TOKEN }}
          TARGET_CHANNEL: ${{ inputs.target }}
          DRY_RUN: ${{ inputs.dry_run }}
          HEADFUL: "1"
        run: xvfb-run -a python cleanup_channel.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cleanup-debug
          path: debug_*.png
          if-no-files-found: ignore
          retention-days: 7
