name: collect-x-posts

on:
  schedule:
    # 毎時23分に起動（GitHubのscheduleは遅延・スキップされるため頻度を上げ、
    # ワークフロー内で前回から1.5時間未満ならスキップして実質1.5時間おきにする）
    - cron: "23 * * * *"
  workflow_dispatch: # Actionsタブから手動実行も可能
    inputs:
      gas_query:
        description: "Webhookクエリ（例: action=delete&ids=123,456 / action=list）"
        required: false
        default: ""
      reimage_id:
        description: "画像を差し替える行のstatus id"
        required: false
        default: ""
      reimage_path:
        description: "差し替えるPNGのリポジトリパス（例: tmp/reimage.png）"
        required: false
        default: ""
      reimage_dir:
        description: "一括差し替え: {statusId}.png を含むディレクトリ"
        required: false
        default: ""

jobs:
  gas:
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.gas_query != '' || github.event.inputs.reimage_id != '' || github.event.inputs.reimage_dir != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Call Apps Script webhook
        if: ${{ github.event.inputs.gas_query != '' }}
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_TOKEN: ${{ secrets.APPS_SCRIPT_TOKEN }}
          QUERY: ${{ github.event.inputs.gas_query }}
        run: |
          resp=$(curl -sfL "$APPS_SCRIPT_URL?token=$APPS_SCRIPT_TOKEN&$QUERY")
          echo "$resp"
      - name: Reimage row via webhook
        if: ${{ github.event.inputs.reimage_id != '' }}
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_TOKEN: ${{ secrets.APPS_SCRIPT_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REIMAGE_ID: ${{ github.event.inputs.reimage_id }}
          REIMAGE_PATH: ${{ github.event.inputs.reimage_path }}
        run: |
          curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${{ github.repository }}/contents/$REIMAGE_PATH" \
            -o /tmp/reimage.png
          python3 - <<PYEOF
          import base64, json, os, urllib.request
          body = json.dumps({
              "token": os.environ["APPS_SCRIPT_TOKEN"],
              "reimageId": os.environ["REIMAGE_ID"],
              "imageBase64": base64.b64encode(open("/tmp/reimage.png","rb").read()).decode(),
          }).encode()
          req = urllib.request.Request(os.environ["APPS_SCRIPT_URL"],
              data=body, method="POST")
          req.add_header("Content-Type", "text/plain")
          print(urllib.request.urlopen(req, timeout=120).read().decode()[:500])
          PYEOF
      - name: Batch reimage rows via webhook
        if: ${{ github.event.inputs.reimage_dir != '' }}
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_TOKEN: ${{ secrets.APPS_SCRIPT_TOKEN }}
          REIMAGE_DIR: ${{ github.event.inputs.reimage_dir }}
        timeout-minutes: 30
        run: |
          python3 - <<PYEOF
          import base64, json, os, urllib.request, glob
          files = sorted(glob.glob(os.path.join(os.environ["REIMAGE_DIR"], "*.png")))
          print(f"{len(files)} files")
          for f in files:
              sid = os.path.splitext(os.path.basename(f))[0]
              body = json.dumps({
                  "token": os.environ["APPS_SCRIPT_TOKEN"],
                  "reimageId": sid,
                  "imageBase64": base64.b64encode(open(f,"rb").read()).decode(),
              }).encode()
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(
                          os.environ["APPS_SCRIPT_URL"], data=body, method="POST")
                      req.add_header("Content-Type", "text/plain")
                      print(sid, urllib.request.urlopen(req, timeout=180)
                            .read().decode()[:200], flush=True)
                      break
                  except Exception as e:
                      print(sid, "retry", attempt, e, flush=True)
          PYEOF

  collect:
    if: ${{ github.event_name == 'schedule' || (github.event.inputs.gas_query == '' && github.event.inputs.reimage_id == '' && github.event.inputs.reimage_dir == '') }}
    concurrency: collect  # 定期実行と手動実行の並走を防止（二重保存対策）
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 直近3時間以内にschedule実行済みならスキップ
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          last=$(gh run list --workflow collect-x-posts --event schedule \
            --status completed --limit 1 --json createdAt -q '.[0].createdAt // ""')
          if [ -z "$last" ]; then
            echo "初回schedule実行"; exit 0
          fi
          diff=$(( $(date +%s) - $(date -d "$last" +%s) ))
          echo "前回schedule: $last (${diff}秒前)"
          if [ "$diff" -lt 5400 ]; then
            echo "1.5時間未満のためスキップ"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Setup Cloudflare WARP (residential-like egress)
        if: steps.guard.outputs.skip != 'true'
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ noble main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode warp
          warp-cli --accept-tos connect
          sleep 5
          warp-cli --accept-tos status || true
          curl -s --max-time 15 https://cloudflare.com/cdn-cgi/trace | head -5

      - name: Restore X session
        if: steps.guard.outputs.skip != 'true'
        run: echo "$X_STATE_JSON" > state.json
        env:
          X_STATE_JSON: ${{ secrets.X_STATE_JSON }}

      - name: Run collector
        if: steps.guard.outputs.skip != 'true'
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_TOKEN: ${{ secrets.APPS_SCRIPT_TOKEN }}
          MAX_SCROLLS: "300"
          MAX_SHOTS: "200"
          HEADFUL: "1"
        run: xvfb-run -a python collector.py

      - uses: actions/upload-artifact@v4
        if: always() && steps.guard.outputs.skip != 'true'
        with:
          name: debug
          path: debug_*.png
          if-no-files-found: ignore
          retention-days: 7
