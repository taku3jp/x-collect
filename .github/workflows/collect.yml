name: collect-x-posts

on:
  schedule:
    # 3時間おき（毎時23分。混雑する0分を避ける）
    - cron: "23 */3 * * *"
  workflow_dispatch: # Actionsタブから手動実行も可能
    inputs:
      delete_ids:
        description: "削除するstatus ID（カンマ区切り。指定時は削除のみ実行）"
        required: false
        default: ""

jobs:
  delete:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.delete_ids != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete rows by status id
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_TOKEN: ${{ secrets.APPS_SCRIPT_TOKEN }}
          IDS: ${{ github.event.inputs.delete_ids }}
        run: |
          resp=$(curl -sfL "$APPS_SCRIPT_URL?token=$APPS_SCRIPT_TOKEN&action=delete&ids=$IDS")
          echo "$resp"
          echo "$resp" | grep -q '"deleted"'

  collect:
    if: ${{ github.event_name == 'schedule' || github.event.inputs.delete_ids == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Setup Cloudflare WARP (residential-like egress)
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ noble main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode warp
          warp-cli --accept-tos connect
          sleep 5
          warp-cli --accept-tos status || true
          curl -s --max-time 15 https://cloudflare.com/cdn-cgi/trace | head -5

      - name: Restore X session
        run: echo "$X_STATE_JSON" > state.json
        env:
          X_STATE_JSON: ${{ secrets.X_STATE_JSON }}

      - name: Run collector
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_TOKEN: ${{ secrets.APPS_SCRIPT_TOKEN }}
          MAX_SCROLLS: "50"
          MAX_SHOTS: "25"
          HEADFUL: "1"
        run: xvfb-run -a python collector.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug
          path: debug_*.png
          if-no-files-found: ignore
          retention-days: 7
