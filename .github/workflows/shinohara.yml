name: collect-shinohara-posts

# リプ欄に篠原ページ（xfans.tokyo/shinohara_kaede,
# myfans.jp/shinohara_personal）へのリンクがあるポストを
# 「篠原バズ」タブに収集する。
# 手動実行で backfill=true にすると「X収集」「実際伸びた投稿」タブの
# 既存行を遡及精査してマッチ分をコピーする。
on:
  schedule:
    # 6時間おき（GitHubのscheduleは遅延・スキップされうる）
    - cron: "22 */6 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "既存行から遡及収集 (true/false)"
        required: false
        default: "false"
      max_save:
        description: "1回の実行で保存する最大件数"
        required: false
        default: "30"
      search_scrolls:
        description: "検索結果の最大スクロール回数"
        required: false
        default: "15"
      start:
        description: "バックフィル: スキップする先頭行数（前回途中まで進んだ分）"
        required: false
        default: "0"

jobs:
  shinohara:
    concurrency: shinohara
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Setup Cloudflare WARP (residential-like egress)
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ noble main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode warp
          warp-cli --accept-tos connect
          sleep 5
          warp-cli --accept-tos status || true
          curl -s --max-time 15 https://cloudflare.com/cdn-cgi/trace | head -5

      - name: Restore X session
        run: echo "$X_STATE_JSON" > state.json
        env:
          X_STATE_JSON: ${{ secrets.X_STATE_JSON }}

      - name: Collect shinohara posts
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_TOKEN: ${{ secrets.APPS_SCRIPT_TOKEN }}
          SHINOHARA_BACKFILL: ${{ inputs.backfill == 'true' && '1' || '0' }}
          SHINOHARA_MAX_SAVE: ${{ inputs.max_save || '30' }}
          SHINOHARA_START: ${{ inputs.start || '0' }}
          SHINOHARA_SEARCH_SCROLLS: ${{ inputs.search_scrolls || '15' }}
          HEADFUL: "1"
        run: xvfb-run -a python shinohara_tracker.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shinohara-debug
          path: debug_*.png
          if-no-files-found: ignore
          retention-days: 7
